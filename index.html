<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashgram - Test Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            border-radius: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 16px rgba(139, 92, 246, 0.3);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            fill: white;
        }

        .app-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #f472b6, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
        }

        .typing-box {
            background: #090d16;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid #334155;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .typing-text {
            font-size: 24px;
            font-weight: 600;
            color: #38bdf8;
            display: inline-block;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 24px;
            background-color: #38bdf8;
            margin-left: 4px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Flashgram Logo -->
        <div class="logo-container">
            <svg class="logo-icon" viewBox="0 0 24 24">
                <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
        </div>

        <!-- App Name -->
        <h1 class="app-title">Flashgram</h1>

        <!-- Typing Animation Box -->
        <div class="typing-box">
            <span class="typing-text" id="typed"></span><span class="cursor"></span>
        </div>

        <!-- Replay Button -->
        <button class="btn" onclick="startTyping()">Replay Animation</button>
    </div>

    <script>
        const textToType = "Hello 👋";
        const typedElement = document.getElementById("typed");
        let index = 0;
        let timer;

        function startTyping() {
            clearTimeout(timer);
            typedElement.textContent = "";
            index = 0;
            typeNextChar();
        }

        function typeNextChar() {
            if (index < textToType.length) {
                typedElement.textContent += textToType.charAt(index);
                index++;
                timer = setTimeout(typeNextChar, 150);
            }
        }

        // Start animation on load
        window.onload = startTyping;
    </script>

</body>
</html>
