<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashgram</title>

    <!-- CSS লিঙ্কসমূহ -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="home/home.css">
</head>
<body>

    <!-- টপ লোগো বার -->
    <header class="top-header">
        <h1 class="brand-logo">Flashgram</h1>
        <div class="header-icons">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
    </header>

    <!-- ফিড কনটেন্ট সেকশন -->
    <main class="feed-scroll-container">

        <!-- স্টোরি সেকশন -->
        <section class="stories-wrapper">
            <div class="story-item">
                <div class="story-avatar-container my-story-ring">
                    <img src="https://via.placeholder.com/68" class="story-img" alt="Your Story">
                    <div class="add-icon">+</div>
                </div>
                <span class="story-username">Your story</span>
            </div>
            <div class="story-item">
                <div class="story-avatar-container">
                    <img src="https://via.placeholder.com/68" class="story-img" alt="User">
                </div>
                <span class="story-username">shabnam_ai ✨</span>
            </div>
        </section>

        <!-- ফিড পোস্ট সেকশন -->
        <article class="post-card">
            <div class="post-user-bar">
                <div class="user-profile-info">
                    <img src="https://via.placeholder.com/32" class="user-avatar-sm" alt="Profile">
                    <div>
                        <span class="username-text">Sohail Mandal</span>
                        <span class="follow-btn-text">• Follow</span>
                    </div>
                </div>
            </div>

            <div class="post-media-box">
                <img src="https://via.placeholder.com/400x400" alt="Post content">
            </div>

            <div class="post-action-bar">
                <div class="left-actions">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                </div>
            </div>
        </article>

    </main>

    <!-- বটম নেভিগেশন বার -->
    <nav class="bottom-nav">
        <button class="nav-item active" aria-label="Home">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.099l-10 8.66v11.241h7v-7h6v7h7v-11.241l-10-8.66z"/></svg>
        </button>
        <button class="nav-item" aria-label="Reels">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="m10 15 5-3-5-3v6z"/></svg>
        </button>
        <button class="nav-item" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="nav-item" aria-label="Profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
    </nav>

    <script src="js/navigation.js"></script>
</body>
</html>
