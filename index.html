<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashgram</title>
    <!-- CSS লিঙ্ক -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ১. টপ হেডার / নেভিগেশন বার -->
    <header class="top-nav">
        <h1 class="logo">Flashgram</h1>
        <div class="nav-icons">
            <button class="icon-btn" aria-label="Notifications">🔔</button>
            <button class="icon-btn" aria-label="Messages">💬</button>
        </div>
    </header>

    <!-- মেইন কনটেন্ট এরিয়া -->
    <main class="main-container">

        <!-- ২. স্টোরি সেকশন (Stories) -->
        <section class="stories-container">
            <div class="story my-story">
                <div class="add-story-btn">+</div>
                <span>আপনার স্টোরি</span>
            </div>
            <div class="story">
                <img src="https://via.placeholder.com/60" alt="User">
                <span>User 1</span>
            </div>
            <div class="story">
                <img src="https://via.placeholder.com/60" alt="User">
                <span>User 2</span>
            </div>
        </section>

        <!-- ৩. পোস্ট তৈরি করার সেকশন (Create Post) -->
        <section class="create-post-card">
            <div class="post-input-box">
                <img src="https://via.placeholder.com/40" class="avatar" alt="Profile">
                <input type="text" placeholder="আজকে আপনার মনে কী চলছে, Flashgram-এ শেয়ার করুন...">
            </div>
            <div class="post-actions">
                <button class="action-btn">📷 ফটো / ভিডিও</button>
                <button class="action-btn post-submit">পোস্ট করুন</button>
            </div>
        </section>

        <!-- ৪. সোশ্যাল মিডিয়া ফিড / পোস্টগুলো (Feed Section) -->
        <section class="feed-container">

            <!-- একটা স্যাম্পল পোস্ট -->
            <article class="post-card">
                <div class="post-header">
                    <img src="https://via.placeholder.com/40" class="avatar" alt="User">
                    <div class="user-info">
                        <h3>Sohail Mandal</h3>
                        <span class="post-time">১০ মিনিট আগে</span>
                    </div>
                </div>
                
                <div class="post-content">
                    <p>Flashgram-এর নতুন ডিজাইন কেমন লাগছে আপনাদের? 🚀🔥</p>
                    <img src="https://via.placeholder.com/400x300" class="post-image" alt="Post Content">
                </div>

                <div class="post-footer">
                    <button class="like-btn">❤️ <span class="like-count">২৫</span></button>
                    <button class="comment-btn">💬 কমেন্ট</button>
                    <button class="share-btn">🚀 শেয়ার</button>
                </div>
            </article>

        </section>

    </main>

    <!-- ৫. বটম নেভিগেশন বার (মোবাইল অ্যাপ লুকের জন্য) -->
    <nav class="bottom-nav">
        <button class="nav-item active">🏠<span>হোম</span></button>
        <button class="nav-item">🔍<span>সার্চ</span></button>
        <button class="nav-item">➕<span>প্লাস</span></button>
        <button class="nav-item">🎬<span>রিলস</span></button>
        <button class="nav-item">👤<span>প্রোফাইল</span></button>
    </nav>

    <!-- JavaScript লিঙ্ক -->
    <script src="js/app.js"></script>
</body>
</html>
