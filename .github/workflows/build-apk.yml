name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare Web Directory
        run: |
          mkdir www
          cp -r index.html css home js assets www/ 2>/dev/null || cp -r index.html css home js www/

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor App
        run: |
          npx cap init Flashgram com.sohail.flashgram --web-dir www

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Capacitor Files
        run: |
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flashgram-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
